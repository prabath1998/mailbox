name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the web UI
        run: cd frontend && npm ci && npm run build
      # web/dist is committed so `go install` works without Node; make sure it matches the source.
      - name: Check web/dist is up to date
        run: git diff --exit-code --stat -- web/dist || (echo "Run 'cd frontend && npm run build' and commit web/dist." && exit 1)
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
