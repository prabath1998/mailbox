# Builds release binaries for every platform and publishes them to GitHub Releases.
# Run by .github/workflows/release.yml when a v* tag is pushed.
version: 2
project_name: mailbox

builds:
  - env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version=v{{ .Version }}"]

archives:
  # No version in the name, so /releases/latest/download/<name> always works (install.sh relies on it).
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^chore:", "^ci:"]

# Homebrew: `brew install prabath1998/tap/mailbox`. Needs the github.com/prabath1998/homebrew-tap
# repo and a HOMEBREW_TAP_TOKEN secret; without the secret this step is skipped.
# `brews` (a formula) rather than `homebrew_casks`: it also works on Linux and macOS
# Gatekeeper does not block the unsigned binary.
brews:
  - name: mailbox
    repository:
      owner: prabath1998
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_TOKEN" "" }}'
    directory: Formula
    homepage: https://github.com/prabath1998/mailbox
    description: Catches the email your app sends and shows it in a web UI
    skip_upload: '{{ if eq (envOrDefault "HOMEBREW_TAP_TOKEN" "") "" }}true{{ else }}auto{{ end }}'
    install: |
      bin.install "mailbox"
    test: |
      system "#{bin}/mailbox", "-version"
    # Lets people run it in the background with `brew services start mailbox`.
    service: |
      run [opt_bin/"mailbox"]
      keep_alive true
      log_path var/"log/mailbox.log"
      error_log_path var/"log/mailbox.log"
